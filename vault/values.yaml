# HashiCorp Vault, standalone with file storage on a PVC.
# Lab setup: TLS is off inside the cluster and unsealing is manual (vault/setup.sh).
# On EKS, enable TLS and use auto-unseal with AWS KMS (seal "awskms").
injector:
  enabled: false

server:
  standalone:
    enabled: true
    config: |-
      ui = true

      listener "tcp" {
        tls_disable     = 1
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        telemetry {
          unauthenticated_metrics_access = "true"
        }
      }

      storage "file" {
        path = "/vault/data"
      }

      telemetry {
        prometheus_retention_time = "30s"
        disable_hostname          = true
      }

# Exposes Vault metrics to Prometheus. vault/setup.sh turns the ServiceMonitor
# on only when the Prometheus Operator CRDs are installed.
serverTelemetry:
  serviceMonitor:
    enabled: false
