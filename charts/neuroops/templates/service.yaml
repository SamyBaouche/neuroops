apiVersion: v1
kind: Service
metadata:
  name: neuroops-service
  labels:
    {{- include "neuroops.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "neuroops.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: http
